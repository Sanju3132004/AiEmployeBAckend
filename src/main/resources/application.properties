# ===================== Application =====================
spring.application.name=ai-employee-support-assistant
server.port=8080

# ===================== MySQL / JPA =====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_employee_support?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================== Owner Bootstrap =====================
# One-time secret used only to create the very first ADMIN (owner) account
# via POST /api/auth/register-owner. Set OWNER_SETUP_KEY env var to your own secret.
# After the first ADMIN account exists, this endpoint stops working on its own.
app.owner-setup-key=NsTech2026

# ===================== JWT =====================
# Set JWT_SECRET env var to a long random secret (min 32 chars) in production
